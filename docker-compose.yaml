services:
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpg-backend
    networks:
      - rpg-net
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpg-frontend
    networks:
      - rpg-net
    env_file:
      - ./frontend/.env
    depends_on:
      - backend-service
    ports:
      - "3000:80"
    restart: unless-stopped

networks:
  rpg-net:
    driver: bridge
